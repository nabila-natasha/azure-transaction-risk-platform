trigger: none

pool:
  name: Default

stages:

- stage: Plan
  displayName: 'Terraform Plan'

  jobs:
  - job: TerraformPlan
    displayName: 'Generate Terraform Plan'

    steps:
    - checkout: self

    - script: |
        echo "=== Environment ==="
        echo "Agent: $(Agent.Name)"
        echo "OS: $(Agent.OS)"
        terraform version
        az version
      displayName: 'Verify build environment'

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: 'sc-transaction-risk-platform'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          cd infra/terraform

          echo "=== Terraform Init ==="
          terraform init

          echo "=== Terraform Validate ==="
          terraform validate

          echo "=== Terraform Plan ==="
          terraform plan -out=tfplan
      env:
        TF_VAR_synapse_sql_admin_password: $(SYNAPSE_SQL_ADMIN_PASSWORD)

    - publish: infra/terraform/tfplan
      artifact: terraform-plan
      displayName: 'Publish Terraform Plan'


- stage: Apply
  displayName: 'Terraform Apply'
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - deployment: TerraformApply
    displayName: 'Apply Terraform Plan'
    environment: 'terraform-production'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - download: current
            artifact: terraform-plan
            displayName: 'Download Terraform Plan'

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: 'sc-transaction-risk-platform'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                cd infra/terraform

                echo "=== Terraform Init ==="
                terraform init

                echo "=== Terraform Apply ==="
                terraform apply -auto-approve "$(Pipeline.Workspace)/terraform-plan/tfplan"
            env:
              TF_VAR_synapse_sql_admin_password: $(SYNAPSE_SQL_ADMIN_PASSWORD)

          - task: AzureCLI@2
            displayName: 'Post-Deployment Smoke Validation'
            inputs:
              azureSubscription: 'sc-transaction-risk-platform'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                echo "=== Post-Deployment Smoke Validation ==="

                echo "Checking Azure subscription..."
                az account show --query "{name:name,id:id}" -o table

                echo "Checking resource group..."
                az group show \
                  --name rg-transaction-risk-platform \
                  --query "{name:name,location:location,provisioningState:properties.provisioningState}" \
                  -o table

                echo "Checking deployed resources..."
                az resource list \
                  --resource-group rg-transaction-risk-platform \
                  --query "[].{name:name,type:type,state:provisioningState}" \
                  -o table

                echo "=== Smoke validation completed ==="