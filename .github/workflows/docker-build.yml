
name: Docker API Build and Real Model Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-api.txt"
      - "api/**"
      - "src/**"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

jobs:
  docker-test:
    name: Build and test with pinned XGBoost model
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      IMAGE_NAME: transaction-risk-api:validation
      CONTAINER_NAME: transaction-risk-api-test
      MODEL_RUN_ID: "20261012T024013Z"
      TEST_API_KEY: "container-test-key"

    steps:
      - name: Check out public project repository
        uses: actions/checkout@v4

      - name: Set up Python for unit tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-api.txt httpx httpx2

      - name: Run existing Python test suite
        run: python -m pytest tests -q

      - name: Check out private model artifacts
        uses: actions/checkout@v4
        with:
          repository: nabila-natasha/azure-transaction-risk-model-artifacts
          token: ${{ secrets.MODEL_REPO_READ_TOKEN }}
          path: private-model
          persist-credentials: false
          ref: model-20261012T024013Z

      - name: Verify model artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          cd private-model
          sha256sum --check SHA256SUMS
          echo "PASS: all model artifact checksums match"

      - name: Validate pinned model run ID
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import xgboost as xgb
          
          model_dir = Path("private-model")
          manifest = json.loads(
              (model_dir / "manifest.json").read_text(encoding="utf-8")
          )
          
          expected_run_id = "20261012T024013Z"
          
          expected_features = [
              "amt",
              "city_pop",
              "lat",
              "long",
              "merch_lat",
              "merch_long",
              "transaction_hour",
              "day_of_week",
              "month",
              "customer_age",
              "distance_km",
          ]
          
          assert manifest.get("run_id") == expected_run_id, (
              f"Unexpected model run ID: {manifest.get('run_id')}"
          )
          
          manifest_features = manifest.get("features")
          assert manifest_features == expected_features, (
              "Manifest feature names or order differ from the expected contract.\n"
              f"Expected: {expected_features}\n"
              f"Actual:   {manifest_features}"
          )
          
          model_path = model_dir / "model.json"
          assert model_path.is_file(), "model.json is missing"
          
          booster = xgb.Booster()
          booster.load_model(str(model_path))
          
          model_features = booster.feature_names
          assert model_features == expected_features, (
              "The model's actual feature names or order differ from the contract.\n"
              f"Expected: {expected_features}\n"
              f"Actual:   {model_features}"
          )
          
          print("PASS: pinned run ID verified")
          print("PASS: manifest feature names and order verified")
          print("PASS: actual XGBoost feature names and order verified")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: transaction-risk-api:validation

      - name: Start API with the actual saved model
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name "$CONTAINER_NAME" \
            -p 127.0.0.1:8000:8000 \
            -e API_KEY="$TEST_API_KEY" \
            -e MODEL_SOURCE=local \
            -e MODEL_DIR=/models \
            -e MODEL_RUN_ID="$MODEL_RUN_ID" \
            -v "$GITHUB_WORKSPACE/private-model:/models:ro" \
            "$IMAGE_NAME"

      - name: Test health, authentication, metadata and real prediction
        shell: bash
        run: |
          set -euo pipefail

          # Wait for the API to finish loading the real model.
          ready=false
          for i in {1..30}; do
            if curl --silent --show-error --fail \
              http://127.0.0.1:8000/health \
              --output /tmp/health.json; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "ERROR: API did not become healthy"
            docker logs "$CONTAINER_NAME" || true
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/health.json").read_text())
          assert health.get("status") == "ok", health
          print("PASS: health endpoint")
          PY

          # Verify that protected endpoints reject missing credentials.
          status=$(curl --silent --show-error \
            --output /tmp/unauthorized.json \
            --write-out "%{http_code}" \
            http://127.0.0.1:8000/model-info)

          test "$status" = "401"
          echo "PASS: unauthenticated model-info request rejected (401)"
          
          # A valid prediction request without an API key must be rejected.
          status=$(curl --silent --show-error \
            --output /tmp/unauthorized-predict.json \
            --write-out "%{http_code}" \
            --request POST \
            http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            --data '{
              "event_time": "2026-10-15T09:00:00",
              "dob": "1994-02-26T00:00:00",
              "amt": 5000.0,
              "city_pop": 20000,
              "lat": 48.8878,
              "long": -100.9893,
              "merch_lat": 40.351813,
              "merch_long": -122.230347
            }')

          test "$status" = "401"
          echo "PASS: unauthenticated prediction rejected (401)"

          # Authenticated requests with invalid input must be rejected.
          status=$(curl --silent --show-error \
            --output /tmp/invalid-predict.json \
            --write-out "%{http_code}" \
            --request POST \
            http://127.0.0.1:8000/predict \
            -H "X-API-Key: $TEST_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{"amt": "not-a-number"}')

          test "$status" = "422"
          echo "PASS: malformed prediction request rejected (422)"

          # Verify metadata for the exact model run.
          curl --silent --show-error --fail \
            -H "X-API-Key: $TEST_API_KEY" \
            http://127.0.0.1:8000/model-info \
            --output /tmp/model-info.json

          python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("/tmp/model-info.json").read_text())
          assert info.get("model_run_id") == "20261012T024013Z", info
          assert isinstance(info.get("features"), list), info
          assert len(info["features"]) == 11, info
          assert isinstance(info.get("threshold"), (int, float)), info
          assert 0 <= info["threshold"] <= 1, info

          print("PASS: model metadata and pinned run ID")
          print("Model version:", info.get("model_version"))
          print("Feature count:", len(info["features"]))
          print("Threshold:", info["threshold"])
          PY

          # Submit a valid transaction to the actual saved model.
          curl --silent --show-error --fail \
            --request POST \
            http://127.0.0.1:8000/predict \
            -H "X-API-Key: $TEST_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{
              "event_time": "2026-10-15T09:00:00",
              "dob": "1994-02-26T00:00:00",
              "amt": 5000.0,
              "city_pop": 20000,
              "lat": 48.8878,
              "long": -100.9893,
              "merch_lat": 40.351813,
              "merch_long": -122.230347
            }' \
            --output /tmp/prediction.json

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/prediction.json").read_text())
          required = {
              "request_id",
              "fraud_probability",
              "predicted_fraud",
              "risk_band",
              "model_version",
              "model_run_id",
              "threshold",
          }

          missing = required - result.keys()
          assert not missing, f"Missing prediction fields: {sorted(missing)}"
          assert 0 <= result["fraud_probability"] <= 1, result
          assert result["predicted_fraud"] in (0, 1), result
          assert result["model_run_id"] == "20261012T024013Z", result
          assert result["risk_band"] in {"Low", "Medium", "High"}, result

          print("PASS: real-model prediction response")
          print("Fraud probability:", result["fraud_probability"])
          print("Predicted fraud:", result["predicted_fraud"])
          print("Risk band:", result["risk_band"])
          print("Model run ID:", result["model_run_id"])
          PY

      - name: Show container logs if a test fails
        if: failure()
        shell: bash
        run: |
          docker logs "$CONTAINER_NAME" || true

      - name: Remove test container
        if: always()
        shell: bash
        run: |
          docker rm --force "$CONTAINER_NAME" || true
