
name: Docker API Image Build Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-api.txt"
      - "api/**"
      - "src/**"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

jobs:
  docker-build:
    name: Build and smoke-test API container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: transaction-risk-api:validation

      - name: Verify API modules and web interface
        run: |
          docker run --rm \
            --entrypoint python \
            transaction-risk-api:validation \
            -c "import api.main; import src.model_store; import src.scoring; import src.features; from pathlib import Path; assert Path('/app/api/static/index.html').is_file(); print('PASS: API modules import successfully'); print('PASS: Web interface exists in image')"
