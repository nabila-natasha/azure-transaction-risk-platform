
name: Docker API Image Build Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-api.txt"
      - "api/**"
      - "src/**"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

jobs:
  docker-test:
    name: Build and test container inference
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: transaction-risk-api:validation

      - name: Create temporary test model
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/model"

          docker run --rm \
            -v "$RUNNER_TEMP/model:/models" \
            --entrypoint python \
            transaction-risk-api:validation \
            -c 'import json, pandas as pd; from xgboost import XGBClassifier; from src.features import FEATURES; X = pd.DataFrame([[0.1 * (i+j+1) for j in range(len(FEATURES))] for i in range(8)], columns=FEATURES); y = [0,1,0,1,0,1,0,1]; m = XGBClassifier(n_estimators=3, max_depth=2, n_jobs=1, random_state=42); m.fit(X,y); m.save_model("/models/model.json"); json.dump({"run_id":"20261012T024013Z","features":FEATURES}, open("/models/manifest.json","w"))'

      - name: Start API container with temporary model
        run: |
          docker run -d \
            --name transaction-risk-api-test \
            -p 127.0.0.1:8000:8000 \
            -e API_KEY=container-test-key \
            -e MODEL_SOURCE=local \
            -e MODEL_DIR=/models \
            -e MODEL_RUN_ID=20261012T024013Z \
            -v "$RUNNER_TEMP/model:/models:ro" \
            transaction-risk-api:validation

      - name: Test health, authentication, metadata and prediction
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              break
            fi
            sleep 2
          done

          status=$(curl -s -o /dev/null -w "%{http_code}" \
            http://127.0.0.1:8000/model-info)

          test "$status" = "401"
          echo "PASS: unauthenticated request rejected"

          curl -fsS \
            -H "X-API-Key: container-test-key" \
            http://127.0.0.1:8000/model-info

          response=$(curl -fsS \
            -X POST http://127.0.0.1:8000/predict \
            -H "X-API-Key: container-test-key" \
            -H "Content-Type: application/json" \
            -d '{"event_time":"2026-10-15T09:00:00","dob":"1994-02-26T00:00:00","amt":5000.0,"city_pop":20000,"lat":48.8878,"long":-100.9893,"merch_lat":40.351813,"merch_long":-122.230347}')

          echo "$response"

          RESPONSE="$response" python -c 'import json, os; r=json.loads(os.environ["RESPONSE"]); required={"fraud_probability","predicted_fraud","risk_band","model_version","model_run_id"}; assert required.issubset(r), f"Missing fields: {required-set(r)}"; assert 0 <= r["fraud_probability"] <= 1; assert r["predicted_fraud"] in (0,1); print("PASS: container returned a valid prediction response")'

      - name: Show container logs if the test fails
        if: failure()
        run: docker logs transaction-risk-api-test || true

      - name: Clean up test container
        if: always()
        run: docker rm -f transaction-risk-api-test || true
