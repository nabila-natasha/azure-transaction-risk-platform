# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: Default

steps:
- checkout: self

- script: |
    echo "=== Environment ==="
    echo "Agent: $(Agent.Name)"
    echo "OS: $(Agent.OS)"
    python --version
    terraform version
    az version
  displayName: 'Verify build environment'

- script: |
    python -m pip install --upgrade pip
    python -m pip install pytest

    if [ -f requirements.txt ]; then
      python -m pip install -r requirements.txt
    else
      echo "No requirements.txt found; continuing with pytest."
    fi
  displayName: 'Install Python dependencies'

- script: |
    python -m compileall .
  displayName: 'Validate Python syntax'

- script: |
    if find tests -type f -name "test_*.py" -o -name "*_test.py" | grep -q .; then
      python -m pytest tests -v
    else
      echo "No Python test files found; pytest test suite is not yet implemented."
      echo "Skipping automated Python tests."
    fi
  displayName: 'Run Python tests'
- task: AzureCLI@2
  displayName: 'Terraform Plan'
  inputs:
    azureSubscription: 'sc-transaction-risk-platform'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      echo "=== Azure Authentication ==="
      az account show

      echo "=== Terraform Init ==="
      cd infra/terraform
      terraform init

      echo "=== Terraform Validate ==="
      terraform validate

      echo "=== Terraform Plan ==="
      terraform plan -out=tfplan
