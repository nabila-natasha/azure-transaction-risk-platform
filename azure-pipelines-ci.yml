trigger:
- main

pool:
  name: Default

steps:
- checkout: self

- script: |
    echo "=== Environment ==="
    echo "Agent: $(Agent.Name)"
    echo "OS: $(Agent.OS)"
    python --version
    terraform version
    az version
  displayName: 'Verify build environment'

- script: |
    python -m pip install --upgrade pip
    python -m pip install -r requirements.txt
    python -m pip install pytest
  displayName: 'Install Python dependencies'

- script: |
    python -m compileall scripts
  displayName: 'Validate Python syntax'

- script: |
    python -m pytest tests -q
  displayName: 'Run Python test suite'

- task: AzureCLI@2
  displayName: 'Terraform Plan'
  inputs:
    azureSubscription: 'sc-transaction-risk-platform'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      echo "=== Azure Authentication ==="
      az account show

      echo "=== Terraform Init ==="
      cd infra/terraform
      terraform init

      echo "=== Terraform Validate ==="
      terraform validate

      echo "=== Terraform Plan ==="
      terraform plan -out=tfplan
  env:
    TF_VAR_synapse_sql_admin_password: $(SYNAPSE_SQL_ADMIN_PASSWORD)
